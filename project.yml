name: Fits
options:
  bundleIdPrefix: ${BUNDLE_PREFIX}
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: PT3HD7UTA5
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_STRICT_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  FitsKit:
    # Local package inside this repo — not a fetched dependency. Fits has none.
    path: FitsKit

targets:
  Fits:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
      # The scheme's storeKitConfiguration is only a path — Xcode cannot resolve
      # it unless the file is a member of the project. buildPhase: none keeps a
      # test-only file out of the shipped bundle. Paid for on Smaller.
      - path: Support/Fits.storekit
        buildPhase: none
    dependencies:
      - package: FitsKit
      - target: FitsShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.fits
        INFOPLIST_FILE: Support/Fits-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Fits.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"

  FitsShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: FitsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.fits.share
        INFOPLIST_FILE: Support/FitsShare-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/FitsShare.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  Fits:
    build:
      targets:
        Fits: all
    run:
      config: Debug
      storeKitConfiguration: Support/Fits.storekit
    test:
      config: Debug
