name: Uploadable
options:
  bundleIdPrefix: ${BUNDLE_PREFIX}
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: PT3HD7UTA5
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_STRICT_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  UploadableKit:
    # Local package inside this repo — not a fetched dependency. Uploadable has none.
    path: UploadableKit

targets:
  Uploadable:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
      # The scheme's storeKitConfiguration is only a path — Xcode cannot resolve
      # it unless the file is a member of the project. buildPhase: none keeps a
      # test-only file out of the shipped bundle. Paid for on Smaller.
      - path: Support/Uploadable.storekit
        buildPhase: none
    dependencies:
      - package: UploadableKit
      - target: UploadableShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.uploadable
        INFOPLIST_FILE: Support/Uploadable-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Uploadable.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"

  UploadableShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: UploadableKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.uploadable.share
        INFOPLIST_FILE: Support/UploadableShare-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/UploadableShare.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  Uploadable:
    build:
      targets:
        Uploadable: all
    run:
      config: Debug
      storeKitConfiguration: Support/Uploadable.storekit
    test:
      config: Debug
